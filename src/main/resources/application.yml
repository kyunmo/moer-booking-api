# =============================================================================
# application.yml — 모든 환경 공통 설정 (git 추적)
# =============================================================================
# 환경별 시크릿/URL 은 본 파일에 두지 않습니다.
# - 로컬: application-local.yml (기본 활성)
# - 운영: application-prod.yml (환경변수 강제)
#
# 활성 프로필: SPRING_PROFILES_ACTIVE 미설정 시 `local` (아래 7행).
# =============================================================================

spring:
  application:
    name: moer-booking-api

  profiles:
    # 기본 프로필 = local. 운영은 SPRING_PROFILES_ACTIVE=prod 로 활성화.
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JDBC 드라이버 + Hikari 풀 (DB 접속 정보는 프로필별)
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  sql:
    init:
      mode: never  # 나중에 schema.sql 사용 시 always로 변경

  task:
    scheduling:
      pool:
        size: 5

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  # SMTP host/port + 옵션은 공통, 자격증명은 프로필별
  mail:
    host: smtp.worksmobile.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # OAuth2 — 공통 메타데이터(grant-type, redirect-uri, scope, provider 엔드포인트).
  # client-id / client-secret 만 프로필별로 오버라이드.
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          naver:
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
          kakao:
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

mybatis:
  type-aliases-package: io.moer.booking.domain
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # NOTE: <result> 에 EnumTypeHandler 명시 금지 (mybatis-spring 4.0.0 버그).
    #       이 글로벌 default-enum-type-handler 가 entity 필드 타입 기준 자동 변환.
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 8080

# SECURITY (P2-5): Actuator — health/info 만 노출.
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false

# 기본 로깅 (안전한 기본값 = INFO). 프로필에서 오버라이드.
# - local: DEBUG (개발 가시성)
# - prod : WARN (민감 정보 노출 방지)
logging:
  level:
    root: INFO
    io.moer.booking: INFO
    org.springframework.web: INFO

# JWT 토큰 만료 시간은 공통, 시크릿은 프로필별
jwt:
  access-token-expiration: 3600000   # 1시간
  refresh-token-expiration: 604800000  # 7일

# Swagger / OpenAPI UI 설정 (활성/비활성 토글은 프로필별)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# 파일 업로드 정책 (확장자/크기 제한은 공통, 저장 경로는 프로필별)
app:
  storage:
    allowed-extensions: jpg,jpeg,png,webp
    max-file-size: 5242880  # 5MB
