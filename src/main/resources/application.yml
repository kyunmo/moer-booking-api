spring:
  application:
    name: moer-booking-api

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/moer_dev
    username: moer
    password: moer2026@
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  sql:
    init:
      mode: never  # 나중에 schema.sql 사용 시 always로 변경

  # 스케줄러 설정
  task:
    scheduling:
      pool:
        size: 5  # 스케줄러 스레드 풀 크기

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  # Email 설정 (네이버 웍스 SMTP)
  mail:
    host: smtp.worksmobile.com
    port: 587
    username: ${MAIL_USERNAME:kkm@moer.io}
    password: ${MAIL_PASSWORD:U3SXTOXHzkPX}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # OAuth2 설정 (Phase 3: SNS 로그인)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:325667166855-l1er4hseic3pn5dfmqs8cpv7kq79hp0k.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          naver:
            client-id: ${NAVER_CLIENT_ID:m5JkQiqh_8UyKO365EAh}
            client-secret: ${NAVER_CLIENT_SECRET:JcUZkcUPhe}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email

          kakao:
            client-id: ${KAKAO_CLIENT_ID:37ec5f253dda4a9f0c543ee0249557f5}
            client-secret: ${KAKAO_CLIENT_SECRET:8zOJXees3y4v1Zz2vckIfmhjCVYRNVcU}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

mybatis:
  type-aliases-package: io.moer.booking.domain
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 8080

logging:
  level:
    root: INFO
    com.moer.booking: DEBUG
    org.springframework.web: DEBUG

jwt:
  secret: ${JWT_SECRET:moer-booking-system-secret-key-change-this-in-production-minimum-256-bits}
  access-token-expiration: 3600000  # 1시간 (밀리초)
  refresh-token-expiration: 604800000  # 7일 (밀리초)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# 애플리케이션 설정
app:
  mail:
    from: ${MAIL_FROM:kkm@moer.io}
    reset-password-url: ${FRONTEND_URL:http://localhost:5173}/reset-password
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2-redirect}
    customer-redirect-uri: ${OAUTH2_CUSTOMER_REDIRECT_URI:http://localhost:5173/oauth2-redirect}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
  storage:
    upload-dir: ${UPLOAD_DIR:C:/Project/uploads}
    allowed-extensions: jpg,jpeg,png,webp
    max-file-size: 5242880