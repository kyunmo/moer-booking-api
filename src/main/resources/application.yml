spring:
  application:
    name: moer-booking-api

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/moer_dev
    username: moer
    password: moer2026@
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  sql:
    init:
      mode: never  # 나중에 schema.sql 사용 시 always로 변경

mybatis:
  type-aliases-package: io.moer.booking.domain
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 8080

logging:
  level:
    root: INFO
    com.moer.booking: DEBUG
    org.springframework.web: DEBUG

jwt:
  secret: ${JWT_SECRET:moer-booking-system-secret-key-change-this-in-production-minimum-256-bits}
  access-token-expiration: 3600000  # 1시간 (밀리초)
  refresh-token-expiration: 604800000  # 7일 (밀리초)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-consumes-media-type: application/json
  default-produces-media-type: application/json