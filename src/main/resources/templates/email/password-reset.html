<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 30px;
            margin: 20px 0;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
            font-weight: bold;
        }
        .button:hover {
            background-color: #2980b9;
        }
        .warning {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>안녕하세요, <span th:text="${name}"></span>님</h2>

        <p>비밀번호 재설정을 요청하셨습니다.</p>

        <p>아래 버튼을 클릭하여 새 비밀번호를 설정해주세요.</p>

        <a th:href="${resetUrl}" class="button">비밀번호 재설정하기</a>

        <div class="warning">
            <strong>중요:</strong> 이 링크는 <span th:text="${expirationMinutes}"></span>분간만 유효합니다.
        </div>

        <p>버튼이 작동하지 않으면 아래 링크를 복사하여 브라우저에 붙여넣으세요:</p>
        <p style="word-break: break-all; color: #666; font-size: 12px;">
            <span th:text="${resetUrl}"></span>
        </p>

        <p style="margin-top: 30px; color: #666;">
            이 요청을 하지 않으셨다면 이 이메일을 무시하셔도 됩니다.<br>
            비밀번호는 변경되지 않습니다.
        </p>
    </div>

    <div class="footer">
        <p>이 이메일은 moer 예약 시스템에서 자동으로 발송되었습니다.</p>
        <p>문의사항이 있으시면 고객센터로 연락해주세요.</p>
    </div>
</body>
</html>
